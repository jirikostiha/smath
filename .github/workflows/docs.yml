name: Documentation

on:
  # Docs deploy on tag as the `docs` job of github-release.yml. This standalone
  # entry is manual-only: a `release: published` trigger never fires for releases
  # created with GITHUB_TOKEN, so it was dead.
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: jirikostiha/ci/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
