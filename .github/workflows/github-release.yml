name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/smath.slnx
      configuration: Release
      format-check: true # reports dotnet format issues on the released ref (non-blocking)
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true

  benchmark:
    needs: build
    uses: jirikostiha/ci/.github/workflows/benchmark.yml@v1
    permissions:
      contents: write
      deployments: write
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      project: src/quality/SMath__Benchmarks

  docs:
    needs: benchmark
    uses: jirikostiha/ci/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    uses: jirikostiha/ci/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      attach-binaries: false # a library: the NuGet package carries the binaries

  publish: # last: a nuget.org push cannot be undone, so it waits for the GitHub release
    needs: release
    permissions:
      contents: read
      checks: write # required statically by the (skipped) build job in nuget-publish.yml
      id-token: write
    uses: ./.github/workflows/nuget-publish.yml
    with:
      reuse-artifacts: true # push the packages built above, not a second build
