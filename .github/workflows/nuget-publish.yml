name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/smath.slnx
      configuration: Release
      ref: ${{ inputs.tag }}
      artifacts: true
      binaries-path: artf/SMath/bin

  publish:
    needs: build
    uses: jirikostiha/ci/.github/workflows/nuget-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      user: jiri
