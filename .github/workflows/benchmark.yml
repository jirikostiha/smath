name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/code/**"

concurrency:
  group: ${{ github.workflow }}

jobs:
  benchmark:
    uses: jirikostiha/ci/.github/workflows/benchmark.yml@v1
    permissions:
      contents: write
      deployments: write
    with:
      project: src/quality/SMath__Benchmarks
