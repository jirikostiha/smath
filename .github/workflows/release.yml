name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  build: # build + test + pack Release once, artifacts flow downstream
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/smath.slnx
      configuration: Release
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true

  release:
    needs: build
    uses: jirikostiha/ci/.github/workflows/gh-release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: release
    uses: jirikostiha/ci/.github/workflows/nuget-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      user: jiri
