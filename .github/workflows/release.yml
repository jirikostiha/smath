name: Release

env:
  binaries-dir: "build"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  build: # builds, tests and packs Release once for the whole release flow
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      configuration: Release
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true
    permissions:
      contents: read
      checks: write

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Download artifact - binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: "${{ env.binaries-dir }}"

      - name: Zip binaries
        uses: vimtor/action-zip@v1
        with:
          files: "${{ env.binaries-dir }}"
          dest: binaries.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: binaries.zip
          token: ${{ secrets.GITHUB_PACKAGE_PUSH_PAT }}

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 8
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish: # reuses the packages built above, no rebuild
    name: Publish
    needs: [release]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
      checks: write
