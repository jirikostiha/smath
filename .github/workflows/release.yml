name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  build:
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: ./src/smath.slnx
      configuration: Release
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true
      binaries-path: artf/SMath/bin

  benchmark:
    needs: build
    uses: jirikostiha/ci/.github/workflows/benchmark.yml@v1
    permissions:
      contents: write
      deployments: write
    with:
      project: src/quality/SMath__Benchmarks

  docs:
    needs: [build, benchmark]
    uses: jirikostiha/ci/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    uses: jirikostiha/ci/.github/workflows/gh-release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: [release, docs]
    uses: jirikostiha/ci/.github/workflows/nuget-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      user: jiri
